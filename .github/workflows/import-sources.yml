name: Import original game sources
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and verify original game
        run: |
          set -euo pipefail
          unzip -q ITALIA_VIVA_V0.1_SORGENTI_COMPLETI.zip -d /tmp/italia-viva-import
          SOURCE=/tmp/italia-viva-import/ITALIA_VIVA_V0.1_SORGENTI_COMPLETI
          test -f "$SOURCE/dist/index.html"
          mkdir -p dist tests
          cp -R "$SOURCE/dist/." dist/
          cp -R "$SOURCE/tests/." tests/
          rm ITALIA_VIVA_V0.1_SORGENTI_COMPLETI.zip
          test -f dist/vendor/three.module.js
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Save extracted files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist tests ITALIA_VIVA_V0.1_SORGENTI_COMPLETI.zip
          if ! git diff --cached --quiet; then
            git commit -m "Import complete V0.1 game files and remove ZIP archive"
            git push
          fi
